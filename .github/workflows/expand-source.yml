name: Diagnose OTPMarket source commit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-otpmarket-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/fix-otpmarket-pterodactyl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-otpmarket-pterodactyl
          fetch-depth: 0

      - name: Detect whether diagnosis is needed
        id: detect
        shell: bash
        run: |
          if [ -f .github/push-debug-from-action.log ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract and test commit
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set +e
          cat .source/part-* > /tmp/otpmarket-source.tar.gz.b64
          base64 --decode --ignore-garbage /tmp/otpmarket-source.tar.gz.b64 > /tmp/otpmarket-source.tar.gz
          tar -xzf /tmp/otpmarket-source.tar.gz -C .
          rm -rf .source .github/FIX_IN_PROGRESS*.md .github/expand-debug-from-action.log
          {
            echo "== git status before add =="
            git status --short
            echo "== configure identity =="
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "== git add =="
            git add -A
            echo "add_status=$?"
            echo "== staged files =="
            git diff --cached --name-status
            echo "== git commit =="
            git commit -m "restore complete OTPMarket source"
            commit_status=$?
            echo "commit_status=$commit_status"
            echo "== git push =="
            git push origin HEAD:agent/fix-otpmarket-pterodactyl
            push_status=$?
            echo "push_status=$push_status"
          } > /tmp/push-debug.log 2>&1
          cat /tmp/push-debug.log
          exit 0

      - name: Save push diagnostic through GitHub API
        if: steps.detect.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          content="$(base64 -w0 /tmp/push-debug.log)"
          jq -n \
            --arg message "save OTPMarket source commit diagnosis" \
            --arg content "$content" \
            --arg branch "agent/fix-otpmarket-pterodactyl" \
            '{message:$message,content:$content,branch:$branch}' > /tmp/payload.json
          curl --fail-with-body -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Lexxyy-Lord/web-nyoba/contents/.github/push-debug-from-action.log" \
            --data-binary @/tmp/payload.json
