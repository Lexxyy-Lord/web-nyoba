name: Diagnose OTPMarket source archive

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-otpmarket-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/fix-otpmarket-pterodactyl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-otpmarket-pterodactyl
          fetch-depth: 0

      - name: Detect whether diagnosis is needed
        id: detect
        shell: bash
        run: |
          if [ -f .github/expand-debug-from-action.log ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Diagnose archive
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          set +e
          {
            echo "== source parts =="
            find .source -maxdepth 1 -type f -name 'part-*' -printf '%f %s bytes\n' | sort
            echo "== combined base64 =="
            cat .source/part-* > /tmp/otpmarket-source.tar.gz.b64
            wc -c /tmp/otpmarket-source.tar.gz.b64
            sha256sum /tmp/otpmarket-source.tar.gz.b64
            echo "== decode =="
            base64 --decode --ignore-garbage /tmp/otpmarket-source.tar.gz.b64 > /tmp/otpmarket-source.tar.gz
            echo "decode_status=$?"
            wc -c /tmp/otpmarket-source.tar.gz
            file /tmp/otpmarket-source.tar.gz
            sha256sum /tmp/otpmarket-source.tar.gz
            echo "== tar validation =="
            tar -tzvf /tmp/otpmarket-source.tar.gz
            echo "tar_status=$?"
          } > /tmp/expand-debug.log 2>&1
          cat /tmp/expand-debug.log
          exit 0

      - name: Save diagnostic through GitHub API
        if: steps.detect.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          content="$(base64 -w0 /tmp/expand-debug.log)"
          jq -n \
            --arg message "save OTPMarket source archive diagnosis" \
            --arg content "$content" \
            --arg branch "agent/fix-otpmarket-pterodactyl" \
            '{message:$message,content:$content,branch:$branch}' > /tmp/payload.json
          curl --fail-with-body -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Lexxyy-Lord/web-nyoba/contents/.github/expand-debug-from-action.log" \
            --data-binary @/tmp/payload.json
