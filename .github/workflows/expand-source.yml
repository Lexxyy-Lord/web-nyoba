name: Expand OTPMarket source

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expand-otpmarket-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expand:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/fix-otpmarket-pterodactyl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-otpmarket-pterodactyl
          fetch-depth: 0

      - name: Detect staging source
        id: staging
        shell: bash
        run: |
          if [ -f .github/expand-status ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif find .source -maxdepth 1 -type f -name 'part-*' -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diagnose and expand source
        if: steps.staging.outputs.available == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p .github
          exec > >(tee .github/expand-debug.log) 2>&1
          echo "== source parts =="
          find .source -maxdepth 1 -type f -name 'part-*' -printf '%f %s bytes\n' | sort
          echo "== combine =="
          cat .source/part-* > /tmp/otpmarket-source.tar.gz.b64
          wc -c /tmp/otpmarket-source.tar.gz.b64
          sha256sum /tmp/otpmarket-source.tar.gz.b64
          echo "== decode =="
          base64 --decode --ignore-garbage /tmp/otpmarket-source.tar.gz.b64 > /tmp/otpmarket-source.tar.gz
          decode_status=$?
          echo "decode_status=$decode_status"
          wc -c /tmp/otpmarket-source.tar.gz
          file /tmp/otpmarket-source.tar.gz
          sha256sum /tmp/otpmarket-source.tar.gz
          echo "== tar validation =="
          tar -tzvf /tmp/otpmarket-source.tar.gz > /tmp/otpmarket-files.txt 2>&1
          tar_status=$?
          echo "tar_status=$tar_status"
          head -60 /tmp/otpmarket-files.txt
          if [ "$decode_status" -eq 0 ] && [ "$tar_status" -eq 0 ]; then
            echo "== extraction =="
            tar -xzf /tmp/otpmarket-source.tar.gz -C .
            extract_status=$?
          else
            extract_status=1
          fi
          echo "extract_status=$extract_status"
          if [ "$decode_status" -eq 0 ] && [ "$tar_status" -eq 0 ] && [ "$extract_status" -eq 0 ]; then
            echo 0 > .github/expand-status
          else
            echo 1 > .github/expand-status
          fi
          exit 0

      - name: Commit diagnostic or expanded source
        if: steps.staging.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status="$(cat .github/expand-status)"
          if [ "$status" = "0" ]; then
            rm -rf .source .github/FIX_IN_PROGRESS*.md .github/expand-debug.log .github/expand-status
            git add -A
            git commit -m "restore complete OTPMarket source"
          else
            git add .github/expand-debug.log .github/expand-status
            git commit -m "capture OTPMarket source expansion diagnostics"
          fi
          git push origin HEAD:agent/fix-otpmarket-pterodactyl
