name: Expand OTPMarket source

on:
  push:
    branches:
      - agent/fix-otpmarket-pterodactyl
    paths:
      - .github/workflows/expand-source.yml
      - .source/part-*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expand-otpmarket-source
  cancel-in-progress: true

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-otpmarket-pterodactyl
          fetch-depth: 0

      - name: Decode and expand source
        shell: bash
        run: |
          set -euo pipefail
          test -d .source
          test "$(find .source -maxdepth 1 -type f -name 'part-*' | wc -l)" -ge 10
          cat .source/part-* > /tmp/otpmarket-source.tar.gz.b64
          base64 --decode --ignore-garbage /tmp/otpmarket-source.tar.gz.b64 > /tmp/otpmarket-source.tar.gz
          tar -tzf /tmp/otpmarket-source.tar.gz >/dev/null
          tar -xzf /tmp/otpmarket-source.tar.gz -C .
          rm -rf .source .github/FIX_IN_PROGRESS*.md .github/expand-debug.log .github/expand-status

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restore complete OTPMarket source"
          git push origin HEAD:agent/fix-otpmarket-pterodactyl
