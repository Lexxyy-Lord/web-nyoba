name: Expand OTPMarket source

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expand-otpmarket-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expand:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/fix-otpmarket-pterodactyl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-otpmarket-pterodactyl
          fetch-depth: 0

      - name: Detect staging source
        id: staging
        shell: bash
        run: |
          if find .source -maxdepth 1 -type f -name 'part-*' -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode and expand source
        if: steps.staging.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .source -maxdepth 1 -type f -name 'part-*' | wc -l)" -ge 10
          cat .source/part-* > /tmp/otpmarket-source.tar.gz.b64
          base64 --decode --ignore-garbage /tmp/otpmarket-source.tar.gz.b64 > /tmp/otpmarket-source.tar.gz
          tar -tzf /tmp/otpmarket-source.tar.gz >/dev/null
          tar -xzf /tmp/otpmarket-source.tar.gz -C .
          rm -rf .source .github/FIX_IN_PROGRESS*.md .github/expand-debug.log .github/expand-status

      - name: Commit expanded project
        if: steps.staging.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restore complete OTPMarket source"
          git push origin HEAD:agent/fix-otpmarket-pterodactyl
