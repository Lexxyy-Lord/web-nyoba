name: Expand OTPMarket source

on:
  push:
    branches:
      - agent/fix-otpmarket-pterodactyl
    paths:
      - .github/workflows/expand-source.yml
      - .source/part-*
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/fix-otpmarket-pterodactyl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-otpmarket-pterodactyl
          fetch-depth: 0

      - name: Validate source parts
        shell: bash
        run: |
          set -euo pipefail
          test -d .source
          test "$(find .source -maxdepth 1 -type f -name 'part-*' | wc -l)" -ge 10

      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .source/part-* > /tmp/otpmarket-source.tar.gz.b64
          base64 --decode /tmp/otpmarket-source.tar.gz.b64 > /tmp/otpmarket-source.tar.gz
          tar -tzf /tmp/otpmarket-source.tar.gz >/dev/null
          tar -xzf /tmp/otpmarket-source.tar.gz -C .
          rm -rf .source .github/workflows/expand-source.yml

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restore complete OTPMarket source"
          git push origin HEAD:agent/fix-otpmarket-pterodactyl
