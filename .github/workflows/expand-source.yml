name: Expand OTPMarket source

on:
  push:
    branches:
      - agent/build-otpmarket-rumahotp
    paths:
      - .github/workflows/expand-source.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .source/part-* > /tmp/otpmarket-source.tar.gz.b64
          base64 --decode /tmp/otpmarket-source.tar.gz.b64 > /tmp/otpmarket-source.tar.gz
          tar -xzf /tmp/otpmarket-source.tar.gz -C .
          rm -rf .source .github/workflows/expand-source.yml

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build OTPMarket RumahOTP platform"
          git push
