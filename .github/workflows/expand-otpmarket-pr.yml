name: Expand OTPMarket pull request source

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: read

jobs:
  expand:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/build-otpmarket-rumahotp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OTPMarket branch
        uses: actions/checkout@v4
        with:
          ref: agent/build-otpmarket-rumahotp
          fetch-depth: 0

      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .source
          cat .source/part-* > /tmp/otpmarket-source.tar.gz.b64
          base64 --decode /tmp/otpmarket-source.tar.gz.b64 > /tmp/otpmarket-source.tar.gz
          tar -xzf /tmp/otpmarket-source.tar.gz -C .
          rm -rf .source .github/workflows/expand-source.yml

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build OTPMarket RumahOTP platform"
          git push origin HEAD:agent/build-otpmarket-rumahotp
