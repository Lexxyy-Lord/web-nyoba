name: OTPMarket CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otpmarket-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://otpmarket:otpmarket@127.0.0.1:5432/otpmarket?schema=public
      APP_URL: http://127.0.0.1:3000
      RUMAHOTP_MOCK_MODE: "true"
      RUMAHOTP_API_KEY: ""
      WORKER_SECRET: ci-worker-secret
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_USERNAME: superadmin
      SEED_ADMIN_PASSWORD: ChangeMe123!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Capture test result
        id: tests
        shell: bash
        run: |
          set +e
          npm run test > /tmp/otpmarket-tests.log 2>&1
          status=$?
          cat /tmp/otpmarket-tests.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save test diagnostics
        if: steps.tests.outputs.status != '0' && hashFiles('.github/ci-tests.log') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          content="$(base64 -w0 /tmp/otpmarket-tests.log)"
          jq -n \
            --arg message "save OTPMarket test diagnostics" \
            --arg content "$content" \
            --arg branch "agent/fix-otpmarket-pterodactyl" \
            '{message:$message,content:$content,branch:$branch}' > /tmp/payload.json
          curl --fail-with-body -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Lexxyy-Lord/web-nyoba/contents/.github/ci-tests.log" \
            --data-binary @/tmp/payload.json

      - name: Enforce test result
        if: steps.tests.outputs.status != '0'
        run: exit 1

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
